version: 0.2

# Lab 11 Exercise 1 - the results service. Same shape as the enrolment buildspec, smaller:
# one page, its own VERSION, and build-metadata.json naming "results" so its artifact is
# distinguishable from the enrolment service's.

env:
  variables:
    SERVICE_NAME: "results"
    ARTIFACT_DIR: "dist"

phases:

  pre_build:
    commands:
      - echo "--- pre_build ---"
      - test -f VERSION || { echo "VERSION file is missing"; exit 1; }
      - test -f src/index.html || { echo "src/index.html is missing"; exit 1; }

  build:
    commands:
      - echo "--- build ---"
      - USMS_RELEASE="$(tr -d '[:space:]' < VERSION)"
      - BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - rm -rf "$ARTIFACT_DIR"
      - mkdir -p "$ARTIFACT_DIR"
      - cp -R src/. "$ARTIFACT_DIR"/
      - sed -i.bak -e "s|__RELEASE__|$USMS_RELEASE|g" -e "s|__BUILT_AT__|$BUILT_AT|g" "$ARTIFACT_DIR/index.html"
      - rm -f "$ARTIFACT_DIR/index.html.bak"
      - |
        cat > "$ARTIFACT_DIR/build-metadata.json" << META
        {
          "service": "$SERVICE_NAME",
          "release": "$USMS_RELEASE",
          "builtAt": "$BUILT_AT",
          "buildId": "${CODEBUILD_BUILD_ID:-local}"
        }
        META

  post_build:
    commands:
      - echo "--- post_build ---"
      # A '- |' block, not a quoted "- '! grep ...'" item: the local runner's minimal parser
      # keeps YAML quotes, so a quoted item would reach bash as one word.
      - |
        ! grep -q '__RELEASE__' "$ARTIFACT_DIR/index.html"
      - python3 -m json.tool "$ARTIFACT_DIR/build-metadata.json"

artifacts:
  base-directory: dist
  files:
    - '**/*'
