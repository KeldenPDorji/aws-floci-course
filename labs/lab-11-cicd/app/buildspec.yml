version: 0.2

env:
  variables:
    SERVICE_NAME: "enrolment"
    ARTIFACT_DIR: "dist"
    # Lab 12 Step 14: overridden by the project's IMAGE_REPO_URI (Step 13); "nginx" marks a
    # build that never got a registry.
    IMAGE_REPO_URI: "nginx"

phases:

  install:
    commands:
      - echo "--- install ---"
      - python3 --version
      - sed --version 2>/dev/null | head -1 || echo "BSD sed"
      - docker --version || echo "no docker client in this build image"

  pre_build:
    commands:
      - echo "--- pre_build ---"
      - test -f VERSION || { echo "VERSION file is missing"; exit 1; }
      - python3 -m json.tool config/service.json > /dev/null
      # Exercise 3: parse, do not grep. Indifferent to whitespace and key order; names the
      # expected AND the actual value. Covers the container check (Step 8) and the port
      # check (Step 8 "Your turn"). Standard library only.
      - |
        python3 - << 'PY'
        import json, sys
        cfg = json.load(open("config/service.json"))
        want = {
            "container": ("enrolment-api", "the ECS task definition's container name (Lab 04)"),
            "port": (80, "the ALB target group and the task definition both expect 80"),
        }
        bad = ["config/service.json: %s must be %r - %s - but it is %r"
               % (k, v, why, cfg.get(k, "<missing>"))
               for k, (v, why) in want.items() if cfg.get(k) != v]
        print("\n".join(bad) if bad else "container=%s port=%s" % (cfg["container"], cfg["port"]))
        sys.exit(1 if bad else 0)
        PY
      - echo "configuration validated"
      - USMS_RELEASE="$(tr -d '[:space:]' < VERSION)"
      - echo "release is $USMS_RELEASE"
      # Lab 12 Step 14: log in only if this build can run Docker; the token goes on stdin.
      # Adapted: the guide guards on `docker info` alone, which is true on any developer
      # laptop - the local runner then re-pushed r6 (moving the tag) and tried to push
      # nginx:r6 to Docker Hub. So: only inside CodeBuild, and only to a registry URI.
      - |
        if [ -n "${CODEBUILD_BUILD_ID:-}" ] && [ "${IMAGE_REPO_URI#*/}" != "$IMAGE_REPO_URI" ] && docker info >/dev/null 2>&1; then
          echo "docker daemon reachable - this build will build and push an image"
          aws ecr get-login-password --region "${AWS_REGION_COURSE:-us-east-1}" \
            | docker login --username AWS --password-stdin "${IMAGE_REPO_URI%%/*}" \
            || echo "docker login failed - continuing; the image must already exist"
        else
          echo "no docker daemon in this build container - skipping the image build"
          echo "the image must already exist at ${IMAGE_REPO_URI} with this release tag"
        fi

  build:
    commands:
      - echo "--- build ---"
      - USMS_RELEASE="$(tr -d '[:space:]' < VERSION)"
      - BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - echo "release=$USMS_RELEASE builtAt=$BUILT_AT"
      # Lab 12 Exercise 2: a tag that cannot collide, so the repository can be IMMUTABLE.
      # CodeBuild sets CODEBUILD_BUILD_NUMBER; the local runner does not, so its fallback is a
      # UTC timestamp. The release stays readable at the front: r7-12, r7-local-20261106T111700.
      - IMAGE_TAG="${USMS_RELEASE}-${CODEBUILD_BUILD_NUMBER:-local-$(date -u +%Y%m%dT%H%M%S)}"
      - echo "image tag=$IMAGE_TAG"
      - rm -rf "$ARTIFACT_DIR"
      - mkdir -p "$ARTIFACT_DIR"
      - cp -R src/. "$ARTIFACT_DIR"/
      - sed -i.bak -e "s|__RELEASE__|$USMS_RELEASE|g" -e "s|__BUILT_AT__|$BUILT_AT|g" "$ARTIFACT_DIR/index.html"
      - rm -f "$ARTIFACT_DIR/index.html.bak"
      - |
        cat > "$ARTIFACT_DIR/build-metadata.json" << META
        {
          "service": "$SERVICE_NAME",
          "release": "$USMS_RELEASE",
          "builtAt": "$BUILT_AT",
          "buildId": "${CODEBUILD_BUILD_ID:-local}",
          "sourceVersion": "${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}",
          "imageUri": "${IMAGE_REPO_URI}:$IMAGE_TAG"
        }
        META
      - cp config/service.json "$ARTIFACT_DIR/service.json"
      # Lab 12 Step 14: build and push the image, only where this build can run Docker.
      # It runs after dist/ is assembled, because the Dockerfile COPYs dist/.
      - |
        if [ -n "${CODEBUILD_BUILD_ID:-}" ] && [ "${IMAGE_REPO_URI#*/}" != "$IMAGE_REPO_URI" ] && docker info >/dev/null 2>&1; then
          docker build -t "${IMAGE_REPO_URI}:$IMAGE_TAG" .
          docker push "${IMAGE_REPO_URI}:$IMAGE_TAG" \
            || echo "push failed - see Section 10; the deploy stage will use the existing tag"
        fi
      # Lab 11 Exercise 5, extended in Lab 12: the deployment contract the ECS deploy action
      # reads. A JSON ARRAY, container name from config/service.json (never typed twice). The
      # image is IMAGE_URI if set, otherwise the image this build is for: <repository>:<IMAGE_TAG>.
      - |
        export IMAGE_URI="${IMAGE_URI:-${IMAGE_REPO_URI}:$IMAGE_TAG}"
        python3 -c 'import json,os,sys; c=json.load(open("config/service.json"))["container"]; json.dump([{"name": c, "imageUri": os.environ["IMAGE_URI"]}], open(sys.argv[1], "w"))' "$ARTIFACT_DIR/imagedefinitions.json"
        cat "$ARTIFACT_DIR/imagedefinitions.json"; echo

  post_build:
    commands:
      - echo "--- post_build ---"
      # Record the tests' exit status for finally, then fail the phase if they failed.
      # "&& ... || ..." rather than a bare call so it also works under the local runner's set -e.
      - |
        bash tests/smoke.sh && SMOKE_STATUS=0 || SMOKE_STATUS=$?
        echo "$SMOKE_STATUS" > "${TMPDIR:-/tmp}/usms-smoke-status"
        test "$SMOKE_STATUS" -eq 0
      - ls -l "$ARTIFACT_DIR"
      - cat "$ARTIFACT_DIR/build-metadata.json"
    # Exercise 2: runs whether the commands above succeeded or failed. It does not rescue
    # the phase - a failed post_build still fails the build - it only guarantees the summary.
    finally:
      - |
        mkdir -p "$ARTIFACT_DIR"
        printf 'release=%s tests_exit=%s at=%s\n' "$(tr -d '[:space:]' < VERSION)" "$(cat "${TMPDIR:-/tmp}/usms-smoke-status" 2>/dev/null || echo not-run)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$ARTIFACT_DIR/build-summary.txt"
        cat "$ARTIFACT_DIR/build-summary.txt"

artifacts:
  base-directory: dist
  files:
    - '**/*'

cache:
  paths: []
