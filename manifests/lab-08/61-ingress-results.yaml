# Lab 08 Exercise 4 - the Examinations Office's results endpoint.
# A SECOND Ingress object, not a second load balancer: group.name puts it in the same
# IngressGroup as usms-portal-ingress, so the AWS Load Balancer Controller adds rules to
# the ONE ALB that already exists. The source-ip condition limits this rule to the
# university network; nothing else in the group (enrolment included) inherits it.
# Inert locally: this cluster has no ingress controller (k3s runs with --disable=traefik).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: usms-results-ingress
  namespace: usms
  labels:
    app: usms-results
    project: usms
    lab: "05b"
  annotations:
    # Same group and scheme as usms-portal-ingress -> same ALB, billed once
    alb.ingress.kubernetes.io/group.name: usms-portal
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # Only the university network matches this rule. 203.0.113.0/24 is a documentation
    # range standing in for RTC's real egress CIDR, which IT Services would supply.
    alb.ingress.kubernetes.io/conditions.usms-results: >-
      [{"field":"source-ip","sourceIpConfig":{"values":["203.0.113.0/24"]}}]
    # A stable name, not the ALB's generated one (needs ExternalDNS on real EKS)
    external-dns.alpha.kubernetes.io/hostname: results.usms.example.edu
    alb.ingress.kubernetes.io/tags: Project=USMS,Tier=web,Lab=08,Owner=ExaminationsOffice
spec:
  rules:
    - http:
        paths:
          - path: /examinations/results
            pathType: Prefix
            backend:
              service:
                name: usms-results
                port:
                  number: 80
